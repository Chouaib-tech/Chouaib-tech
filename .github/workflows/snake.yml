name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#EC6E28&color_dots=#ebedf0,#f9c9a8,#f29a5e,#EC6E28,#BB3A10
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EC6E28&color_dots=#161b22,#4a1a08,#7a2a0c,#BB3A10,#EC6E28

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
